{% extends 'base.html' %}Courses | Ilahia Law College{% block content %}
<!-- page title -->
<section class="relative h-[70vh] bg-fixed bg-center bg-cover flex items-center"
  style="background-image: url('/static/newimages/5.JPG');">

  <!-- Dark Overlay -->
  <div class="absolute inset-0 bg-black/20"></div>



</section>
<!-- /page title -->

<!-- COURSES SECTION -->
<section class="relative py-24 bg-slate-50 overflow-hidden">

  <!-- Background Blur -->
  <div class="absolute top-0 right-0 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-blue-500/5 rounded-full blur-3xl"></div>

  <div class="relative max-w-7xl mx-auto px-6 lg:px-8">

    <!-- Heading -->
    <div class="text-center mb-16">

      <span
        class="inline-flex items-center gap-2 px-5 py-2 rounded-full border border-blue-500/20 bg-blue-50 text-blue-500 text-sm uppercase tracking-[3px] font-medium mb-5"
        data-aos="fade-up">
        <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
        Academic Programs
      </span>

      <h2 class="text-4xl md:text-5xl font-bold text-gray-900 leading-tight text-white" data-aos="fade-up">
        Explore Our
        <span class="text-blue-500">
          Courses
        </span>
      </h2>

    </div>

    <!-- Courses Grid -->
    <div class="grid md:grid-cols-2 gap-8 items-stretch">

      {% for c in course %}

      <!-- Course Card -->
      <div
        class="group bg-white backdrop-blur-lg rounded-[30px] overflow-hidden border border-gray-100 shadow-sm hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 flex flex-col h-full"
        data-aos="fade-up">

        <!-- Image -->
        <div class="relative overflow-hidden">

          <img src="{{ c.image.url }}" alt="{{ c.course }}"
            class="w-full h-[260px] object-cover group-hover:scale-110 transition duration-700">

          <!-- Overlay -->
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-black/10 to-transparent"></div>

        </div>

        <!-- Content -->
        <div class="p-8 flex flex-col flex-1">

          <!-- Title -->
          <h3
            class="text-2xl font-bold text-gray-900 leading-snug mb-2 min-h-[64px] group-hover:text-blue-500 transition duration-300">
            {{ c.course }}
          </h3>

          <!-- Description -->
          <p class="text-gray-600 leading-8 mb-8 flex-1">
            {{ c.description }}
          </p>

          <!-- Button Wrapper -->
          <div class="mt-auto pt-2">

            <!-- Button -->
            <a href="{% url 'fiveyears' c.id %}"
              class="inline-flex items-center justify-center gap-3 px-6 py-3 rounded-full bg-blue-500 text-white font-semibold tracking-wide hover:bg-blue-600 transition-all duration-300 shadow-lg shadow-blue-500/20">
              Apply Now

              <i class="fa-solid fa-arrow-right text-sm"></i>
            </a>

          </div>

        </div>

      </div>

      {% endfor %}

    </div>

  </div>

</section>

<!-- PAGE TITLE IMAGE OVERRIDE -->
<style>
  section.page-title-section.overlay[data-background='static/images/backgrounds/page-title.jpg'] {
    background-image: url('static/images/title.jpeg') !important;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
</style>


<!-- Page-level dark theme -->
<style>
  /* ILH_THEME */
  section.page-title-section.overlay {
    min-height: 320px;
    position: relative;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 4rem 0;
  }

  section.page-title-section.overlay::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(8, 15, 39, 0.80);
    z-index: 1;
  }

  section.page-title-section.overlay .container,
  section.page-title-section.overlay .row,
  section.page-title-section.overlay .list-inline,
  section.page-title-section.overlay .col-md-8 {
    position: relative;
    z-index: 2;
  }

  section.page-title-section.overlay .text-lighten,
  section.page-title-section.overlay .h2,
  section.page-title-section.overlay .section-title,
  section.page-title-section.overlay .font-secondary,
  section.page-title-section.overlay p,
  section.page-title-section.overlay a {
    color: #f8fafc !important;
  }

  section.page-title-section.overlay a:hover {
    color: #7dd3fc !important;
  }

  section.page-title-section.overlay .text-primary,
  section.page-title-section.overlay .text-white {
    color: #f8fafc !important;
  }

  section.page-title-section.overlay .font-secondary {
    color: #f8fafc !important;
  }

  section.section,
  section.section-sm,
  section.bg-gray,
  section.bg-white,
  section.bg-light,
  section.bg-slate-50,
  section.bg-gray-100,
  section.bg-gray-200 {
    background-color: #0A192F !important;
    color: #e2e8f0 !important;
  }

  section.section .card,
  section.section .card-body,
  section.section .alert,
  section.section .list-group-item,
  section.section .border,
  section.section .facility-image-container,
  section.section .hostel-image-container,
  section.section .card-title,
  section.section .card-text,
  section.section .btn,
  section.section .form-control {
    background-color: #0f172a !important;
    border-color: rgba(148, 163, 184, 0.2) !important;
    color: #e2e8f0 !important;
  }

  section.section .btn-primary,
  section.section .btn.btn-primary,
  section.section .btn-primary:hover,
  section.section .btn.btn-primary:hover {
    background-color: #2563eb !important;
    border-color: #2563eb !important;
    color: #fff !important;
  }

  section.section a,
  section.section .text-color,
  section.section .btn-link,
  section.section .list-inline-item a {
    color: #7dd3fc !important;
  }

  section.section a:hover,
  section.section .text-color:hover {
    color: #38bdf8 !important;
  }

  section.section .overlay-text {
    background: rgba(15, 23, 42, 0.90) !important;
  }

  section.section .facility-image-container img,
  section.section .hostel-image-container img,
  section.section .card-img-top,
  section.section img {
    object-fit: cover !important;
  }
</style>
{% endblock %}
