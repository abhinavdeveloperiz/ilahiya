<!-- TAILWIND ONLY STYLE -->

    <style>
        .navItem {
            @apply relative text-[15px] font-semibold text-gray-800 transition duration-300 hover:text-[#1e1e4b];
        }

        .mobileNavItem {
            @apply py-4 border-b border-gray-100 text-[15px] font-semibold text-gray-700 transition duration-300 hover:pl-2 hover:text-[#1e1e4b];
        }
    </style>

<script>

    const mobileMenu = document.getElementById("mobileMenu");
    const menuOverlay = document.getElementById("menuOverlay");

    document.getElementById("openMenu").addEventListener("click", () => {

        mobileMenu.style.right = "0";

        menuOverlay.classList.remove("opacity-0", "invisible");

    });

    document.getElementById("closeMenu").addEventListener("click", closeMobileMenu);

    menuOverlay.addEventListener("click", closeMobileMenu);

    function closeMobileMenu() {

        mobileMenu.style.right = "-100%";

        menuOverlay.classList.add("opacity-0", "invisible");

    }

</script>
