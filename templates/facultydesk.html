{% extends 'base.html' %}
{% block content %}
<!-- Page Title Section -->
<section class="page-title-section overlay" data-background="static/images/title.jpeg">
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        <ul class="list-inline custom-breadcrumb">
          <li class="list-inline-item">
            <a class="h2 text-primary font-secondary" href="#">Adminstrator's Desk</a>
          </li>
          <li class="list-inline-item text-white h3 font-secondary"></li>
        </ul>
        <p class="text-lighten">
          Home <i class="fa-solid fa-angles-right"></i> About Us <i class="fa-solid fa-angles-right"></i> Adminstrator's
          Desk
        </p>
      </div>
    </div>
  </div>
</section>
<!-- /Page Title -->

<!-- Faculty Team Section -->
<section class="section">
  <div class="container">
    <div class="row">
      <div class="col-12 text-center">
        <h2 class="section-title" data-aos="fade-left">Faculty Team</h2>
      </div>
    </div>

    <!-- Cards Row -->
    <div class="row justify-content-center text-center">
      <!-- Card 1: Head of Department -->
      {% for f in Faculty %}
      <div class="col-md-3 mb-4" data-aos="fade-up" data-aos-delay="100">
        <div class="card border-0 rounded-lg">
          <img src="{{f.image.url}}" class="card-img-top rounded-top" alt="Head of Department" />
          <div class="card-body">
            <h5 class="card-title mb-1">{{f.name}}</h5>
            <p class="text-dark mb-0">{{f.designation}}</p>
          </div>
        </div>
      </div>
      {% endfor %}

    </div>
  </div>
</section>

<!-- CSS override to make images fully visible with consistent height -->
<style>
  /* Remove fixed height from cards to allow natural height */
  .card {
    height: auto !important;
  }

  /* Set fixed height for images to ensure full display, adjust as needed */
  .card-img-top {
    height: 320px;
    /* You can adjust this height */
    object-fit: contain;
    /* Preserve full image without cropping */
    width: 100%;
    border-top-left-radius: 0.5rem;
    border-top-right-radius: 0.5rem;
  }

  /* Optional: Make card body padding consistent */
  .card-body {
    padding: 1rem;
  }
</style>
{% endblock %}
