{% extends 'base.html' %}
{% block content %}
<!-- Page Title Section -->
<section class="page-title-section overlay" data-background="static/images/title.jpeg">
  <div class="container">
    <div class="row">
      <div class="col-md-8">
        <ul class="list-inline custom-breadcrumb">
          <li class="list-inline-item">
            <a class="h2 text-primary font-secondary" href="#">Principal's Desk</a>
          </li>
        </ul>
        <p class="text-lighten">
          Home <i class="fa-solid fa-angles-right"></i> About Us <i class="fa-solid fa-angles-right"></i> Principal's
          Desk
        </p>
      </div>
    </div>
  </div>
</section>
<!-- /Page Title Section -->

<!-- Principal's Desk Section -->
<section class="section pt-5 pb-5">
  <div class="container">
    <div class="row align-items-center">
      <!-- Image Section -->
      <div class="col-md-5 text-center">
        <img src="{{principal.image.url}}" alt="Principal" class="img-fluid shadow" data-aos="fade-left" />
      </div>
      <!-- Text Section -->
      <div class="col-md-7">
        <h2 class="section-title font-secondary mb-3" data-aos="fade-left">Message from the Principal</h2>
        <p class="text-muted text-justify" data-aos="fade-left">
          <i class="ri-double-quotes-l fs-3"></i>
          
          {{ principal.message }}
          
          <i class="ri-double-quotes-r fs-3"></i>
        </p>
        <p class="font-weight-bold" data-aos="fade-left">{{principal.name}}</p>
        <p class="text-muted" data-aos="fade-left">Principal, Ilahia Law College</p>
      </div>
    </div>
  </div>
</section>
<!-- /Principal's Desk Section -->

<!-- CSS override to replace background image -->
<style>
  section.page-title-section.overlay[data-background='static/images/backgrounds/page-title.jpg'] {
    background-image: url('static/images/title.jpeg') !important;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
</style>
{% endblock %}
